name: Build and Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 對齊你本機目前能正常編譯的 Node.js 20 環境
      - name: Set Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 自動幫你的 npm 做快取快遞

      # 改用 npm 嚴格安裝 package-lock.json 裡宣告的套件，確保雲端跟本機環境一模一樣
      - name: Install Dependencies
        run: npm install

      # 執行清除並編譯
      - name: Build Hexo
        run: |
          npx hexo clean
          npx hexo generate

      # 部署至 gh-pages 分支
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public